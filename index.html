<script>
(()=>{const fukuoka='福岡住宿｜810-0021 福岡県福岡市中央区今泉1-10-12 IONビル5F｜電話 092-282-9780';let changed=false;trip.forEach(day=>{if(['10/21（三）','10/22（四）','10/23（五）','10/24（六）'].includes(day.d)&&!day.s){day.s=fukuoka;changed=true}});if(changed){save();window.render()}
const cards=[...document.querySelectorAll('.travel-info .info-card')],old=cards.find(c=>c.querySelector('h2')?.textContent==='住宿資料');if(!old)return;const inputs=[...old.querySelectorAll('input')],fAddr=inputs[1]?.value||'福岡県福岡市中央区今泉1-10-12 IONビル5F',fPhone=inputs[2]?.value||'092-282-9780',bAddr=inputs[4]?.value||'龜之井酒店 別府｜874-0936 大分縣別府市 Oita町5-17',bPhone=inputs[5]?.value||'0977-22-3301';function hotel(title,fields,keyprefix){let article=document.createElement('article');article.className='info-card';article.innerHTML=`<h2>${title}</h2><div class="info-grid">${fields.map(([name,value],i)=>`<div class="info-field"><label>${name}</label><input data-hotel="${keyprefix}_${i}" value="${esc(value)}"></div>`).join('')}</div>`;article.querySelectorAll('input').forEach(el=>el.oninput=()=>{let saved=JSON.parse(storage.getItem('fukuoka-travel-details-v1')||'{}');saved[el.dataset.hotel]=el.value;storage.setItem('fukuoka-travel-details-v1',JSON.stringify(saved))});old.before(article)}hotel('福岡住宿',[['入住日期','10/17（1晚）、10/20–10/25（10/21–10/24住宿）'],['住宿名稱／地址',fAddr],['住宿電話',fPhone]],'hotel_fukuoka');hotel('別府住宿',[['入住日期','10/18–10/20（10/18、10/19住宿）'],['住宿名稱／地址',bAddr],['住宿電話',bPhone]],'hotel_beppu');old.remove()})();

<style>
.attraction-link{display:inline-flex;align-items:center;gap:4px;width:max-content;margin:2px 0 3px 7px;border-radius:6px;padding:4px 7px;background:#edf4e6;color:#436843;text-decoration:none;font-size:10px}.attraction-link:hover{background:#dfeccc}

<script>
(()=>{const links=[[/別府地獄/, 'https://www.beppu-jigoku.com/index.php','別府地獄之旅官方網站'],[/九州自然動物園|アフリカンサファリ/, 'https://africansafari.co.jp/','九州自然動物園官方網站'],[/海之中道海洋世界|マリンワールド/, 'https://marine-world.jp/','海之中道海洋世界官方網站'],[/麵包超人|アンパンマン/, 'https://www.fukuoka-anpanman.jp/','福岡麵包超人博物館官方網站'],[/唐戶市場|活跳跳馬關街|活きいき馬関街/, 'https://yamaguchi-tourism.jp/spot/detail_18745.html','唐戶市場觀光資訊']];function addLinks(){document.querySelectorAll('#days .row').forEach(row=>{let details=row.querySelector('.details'),name=row.querySelector('.name');if(!details||!name)return;let a=details.querySelector('.attraction-link');if(a)a.remove();let match=links.find(([pattern])=>pattern.test(name.value));if(match){a=document.createElement('a');a.className='attraction-link';a.href=match[1];a.target='_blank';a.rel='noopener';a.textContent='官方網站 ↗';a.title=match[2];name.after(a)}})}const previous=window.render;window.render=function(){previous();addLinks()};document.querySelectorAll('#days .name').forEach(el=>el.addEventListener('input',()=>setTimeout(addLinks,0)));addLinks()})();
</script>
<style>
.row{grid-template-columns:24px 88px minmax(0,1fr) auto auto}.drag-handle{border:0;background:transparent;color:#9aa69a;font-size:18px;padding:4px 2px;cursor:grab;touch-action:none}.drag-handle:active{cursor:grabbing}.row.dragging{opacity:.4}.row.drag-target{background:#f2f6eb}.add{cursor:pointer}@media(max-width:650px){.row{grid-template-columns:22px 60px minmax(0,1fr) auto auto}}
</style>
<script>
(()=>{const root=document.querySelector('#days');function handles(){root.querySelectorAll('.row').forEach(row=>{if(row.querySelector('.drag-handle'))return;let b=document.createElement('button');b.type='button';b.className='drag-handle';b.textContent='⠿';b.title='按住拖曳以調整順序';b.setAttribute('aria-label','拖曳調整行程順序');b.draggable=true;row.prepend(b)});document.querySelector('.info-tip')?.insertAdjacentHTML('beforebegin','<p class="info-tip" style="text-align:left">在每日行程前的 ⠿ 拖曳把手按住，即可調整當日順序。</p>')}const before=window.render;window.render=function(){before();handles()};root.addEventListener('dragstart',e=>{let h=e.target.closest('.drag-handle');if(!h)return;let row=h.closest('.row'),time=row.querySelector('.time'),payload={day:+time.dataset.d,row:+time.dataset.r};e.dataTransfer.setData('text/plain',JSON.stringify(payload));e.dataTransfer.effectAllowed='move';row.classList.add('dragging')});root.addEventListener('dragend',e=>{let row=e.target.closest('.row');row?.classList.remove('dragging');root.querySelectorAll('.drag-target').forEach(x=>x.classList.remove('drag-target'))});root.addEventListener('dragover',e=>{let target=e.target.closest('.row');if(!target)return;let time=target.querySelector('.time');if(!time||!e.dataTransfer.types.includes('text/plain'))return;e.preventDefault();target.classList.add('drag-target')});root.addEventListener('dragleave',e=>e.target.closest('.row')?.classList.remove('drag-target'));root.addEventListener('drop',e=>{let target=e.target.closest('.row');if(!target)return;e.preventDefault();let dt=target.querySelector('.time'),source;try{source=JSON.parse(e.dataTransfer.getData('text/plain'))}catch{return}let d=+dt.dataset.d,toRow=+dt.dataset.r;if(source.day!==d||source.row===toRow)return;let rect=target.getBoundingClientRect(),after=e.clientY>rect.top+rect.height/2;let destination=toRow+(after?1:0),[item]=trip[d].x.splice(source.row,1);if(source.row<destination)destination--;trip[d].x.splice(destination,0,item);save();window.render()});handles()})();
</script></html>
